# ======================================================================
# Render blueprint — MOBILE / flat-upload edition
#
# >>> NO FILE EDITING NEEDED <<<
# The bot token is NOT in this file. You will paste it into Render's
# ENVIRONMENT VARIABLES when creating the service (Render asks for it
# because of "sync: false" below). That's the one manual step.
#
# Full walkthrough: DEPLOY-MOBILE.md (in this folder)
# ======================================================================

services:
  - type: web
    name: lua-obfuscator-bot          # becomes https://lua-obfuscator-bot.onrender.com
    runtime: python
    plan: free                        # free tier + UptimeRobot = 24/7
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py       # binds $PORT and serves /health automatically
    healthCheckPath: /health
    autoDeploy: true                  # every commit to main redeploys automatically
    envVars:
      - key: DISCORD_TOKEN
        sync: false                   # <<< paste your token in RENDER's dashboard <<<
      - key: MAX_FILE_KB
        value: "200"
      - key: PROCESS_TIMEOUT
        value: "25"
      - key: BANNER
        value: "v1.0.1"
